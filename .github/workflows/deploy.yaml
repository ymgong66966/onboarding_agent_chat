name: Build and Deploy Onboarding Agent Chat

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - prod
    paths:
      - 'chat_server.py'
      - 'chat_ui/**'
      - 'chart/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy.yaml'
  pull_request:
    branches:
      - develop
      - prod
    paths:
      - 'chat_server.py'
      - 'chat_ui/**'
      - 'chart/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy.yaml'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AWS_REGION: us-east-2
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: development
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: arn:aws:iam::216989110335:role/OrganizationAccountAccessRole
        role-session-name: github-actions-onboarding-deploy
        role-duration-seconds: 3600
        role-skip-session-tagging: true

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name my-small-cluster

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create/Update Kubernetes Secrets
      run: |
        echo "Creating/updating Kubernetes secrets for development..."
        kubectl create namespace onboarding-agent-dev --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret generic onboarding-agent-keys \
          --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
          --from-literal=LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}" \
          --namespace onboarding-agent-dev \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "Kubernetes secrets created/updated successfully"

    - name: Deploy to Development
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "All image tags from build:"
        echo "${{ needs.build.outputs.image_tag }}"

        IMAGE_TAG=$(echo "${{ needs.build.outputs.image_tag }}" | grep -E "develop-[a-f0-9]{7}" | head -1)
        if [ -z "$IMAGE_TAG" ]; then
          IMAGE_TAG=$(echo "${{ needs.build.outputs.image_tag }}" | head -1)
        fi

        TAG_ONLY=${IMAGE_TAG##*:}
        echo "Selected image tag: $IMAGE_TAG"
        echo "Using tag: $TAG_ONLY"

        helm upgrade --install onboarding-agent-dev ./chart \
          --namespace onboarding-agent-dev \
          --create-namespace \
          --values ./chart/values-dev.yaml \
          --set image.tag="$TAG_ONLY" \
          --set image.pullPolicy=Always \
          --set app.langgraphUrl="${{ secrets.LANGGRAPH_CLOUD_URL }}" \
          --set app.withcareAgentUrl="http://withcare-agent-dev.withcare-agent-dev.svc.cluster.local:80" \
          --wait \
          --timeout 10m

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/onboarding-agent-dev -n onboarding-agent-dev --timeout=300s
        kubectl get pods -n onboarding-agent-dev
        echo ""
        echo "=== Service External URL ==="
        kubectl get svc onboarding-agent-dev -n onboarding-agent-dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' && echo ""

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: arn:aws:iam::676206942273:role/OrganizationAccountAccessRole
        role-session-name: github-actions-onboarding-deploy
        role-duration-seconds: 3600
        role-skip-session-tagging: true

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name mcp-prod-cluster

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create/Update Kubernetes Secrets
      run: |
        echo "Creating/updating Kubernetes secrets for production..."
        kubectl create namespace onboarding-agent --dry-run=client -o yaml | kubectl apply -f -
        kubectl create serviceaccount onboarding-agent-sa -n onboarding-agent --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret docker-registry ghcr-pull-secret \
          --docker-server=ghcr.io \
          --docker-username=${{ github.actor }} \
          --docker-password=${{ secrets.GHCR_PAT }} \
          --namespace onboarding-agent \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret generic onboarding-agent-keys \
          --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
          --from-literal=LANGSMITH_API_KEY="${{ secrets.LANGSMITH_API_KEY }}" \
          --namespace onboarding-agent \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "Kubernetes secrets created/updated successfully"

    - name: Deploy to Production
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        IMAGE_TAG=$(echo "${{ needs.build.outputs.image_tag }}" | grep -E "prod-[a-f0-9]{7}" | head -1)
        if [ -z "$IMAGE_TAG" ]; then
          IMAGE_TAG=$(echo "${{ needs.build.outputs.image_tag }}" | head -1)
        fi

        TAG_ONLY=${IMAGE_TAG##*:}
        echo "Using image tag: $TAG_ONLY"

        helm upgrade --install onboarding-agent-prod ./chart \
          --namespace onboarding-agent \
          --create-namespace \
          --values ./chart/values.yaml \
          --set image.tag="$TAG_ONLY" \
          --set image.pullPolicy=Always \
          --set app.langgraphUrl="${{ secrets.LANGGRAPH_CLOUD_URL }}" \
          --set app.withcareAgentUrl="http://withcare-agent-prod.withcare-agent.svc.cluster.local:80" \
          --set app.withcareChatUrl="http://aaf1460037df64a81b7b2675530d21b0-458461869.us-east-2.elb.amazonaws.com" \
          --wait \
          --timeout 10m

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/onboarding-agent-prod -n onboarding-agent --timeout=300s
        kubectl get pods -n onboarding-agent
        echo ""
        echo "=== Service External URL ==="
        kubectl get svc onboarding-agent-prod -n onboarding-agent -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' && echo ""

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build.outputs.image_tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
