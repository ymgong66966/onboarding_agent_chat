<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Agent Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
  background-color: #f7f7f8;
  height: 100vh;
}

.chat-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 800px;
  margin: 0 auto;
  background: white;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

/* ── Header ─────────────────────────────────────── */

.chat-header {
  padding: 1rem;
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  color: white;
  border-bottom: 1px solid #e0e0e0;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-header h1 {
  font-size: 1.4rem;
  font-weight: 600;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.reset-button {
  padding: 0.4rem 0.8rem;
  background: rgba(255,255,255,0.2);
  color: white;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 0.5rem;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.2s;
}

.reset-button:hover {
  background: rgba(255,255,255,0.35);
}

.session-id {
  font-family: monospace;
  font-size: 0.75rem;
  background: rgba(255,255,255,0.15);
  padding: 0.2rem 0.5rem;
  border-radius: 0.3rem;
}

.user-id-input {
  font-family: monospace;
  font-size: 0.75rem;
  background: rgba(255,255,255,0.15);
  color: white;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 0.2rem 0.5rem;
  border-radius: 0.3rem;
  width: 140px;
  outline: none;
}

.user-id-input::placeholder {
  color: rgba(255,255,255,0.5);
}

.user-id-input:focus {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.6);
}

/* ── Settings panel ────────────────────────────── */

.settings-toggle {
  margin-top: 0.5rem;
}

.settings-toggle-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 0.75rem;
  cursor: pointer;
  padding: 0.2rem 0.6rem;
  border-radius: 0.3rem;
}

.settings-toggle-btn:hover {
  background: rgba(255,255,255,0.35);
}

.settings-panel {
  display: none;
  margin-top: 0.5rem;
  padding: 0.5rem;
  background: rgba(255,255,255,0.1);
  border-radius: 0.4rem;
}

.settings-panel label {
  display: block;
  font-size: 0.75rem;
  margin-bottom: 0.25rem;
  opacity: 0.9;
}

.settings-panel textarea {
  width: 100%;
  min-height: 120px;
  font-family: monospace;
  font-size: 0.7rem;
  background: rgba(0,0,0,0.2);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 0.3rem;
  padding: 0.4rem;
  resize: vertical;
}

.settings-panel select {
  font-size: 0.75rem;
  background: rgba(0,0,0,0.2);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 0.3rem;
  padding: 0.2rem 0.4rem;
  margin-top: 0.25rem;
}

/* ── Completion banner ─────────────────────────── */

.completion-banner {
  display: none;
  padding: 0.75rem 1rem;
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  color: white;
  text-align: center;
  font-weight: 600;
}

.completion-banner a {
  color: white;
  text-decoration: underline;
  font-weight: 700;
}

/* ── Messages ───────────────────────────────────── */

.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  background: #fafafa;
}

.empty-state {
  text-align: center;
  color: #666;
  margin-top: 3rem;
}

.empty-state p {
  margin: 0.5rem 0;
  font-size: 1.1rem;
}

.empty-state .hint {
  font-size: 0.9rem;
  color: #999;
}

.message {
  margin-bottom: 1rem;
  padding: 0.85rem 1rem;
  border-radius: 12px;
  max-width: 85%;
  animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.user-message {
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

.agent-message {
  background: white;
  border: 1px solid #e0e0e0;
  color: #333;
  border-bottom-left-radius: 4px;
}

.message-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.4rem;
  font-size: 0.8rem;
}

.user-message .message-header { opacity: 0.8; }
.agent-message .message-header { color: #888; }

.source-badge { font-weight: 600; }

.message-content {
  line-height: 1.6;
  word-wrap: break-word;
  white-space: pre-wrap;
}

/* ── Loading indicator ──────────────────────────── */

.loading-message {
  background: white;
  border: 1px solid #e0e0e0;
  color: #999;
  border-bottom-left-radius: 4px;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid #e0e0e0;
  border-top-color: #11998e;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ── Debug panel ────────────────────────────────── */

.debug-toggle {
  margin-top: 0.4rem;
  text-align: left;
}

.debug-toggle-btn {
  background: none;
  border: none;
  color: #999;
  font-size: 0.75rem;
  cursor: pointer;
  padding: 0.15rem 0;
}

.debug-toggle-btn:hover { color: #11998e; }

.debug-panel {
  margin-top: 0.4rem;
  padding: 0.5rem 0.6rem;
  background: #f5f5f5;
  border-radius: 6px;
  font-size: 0.75rem;
  font-family: monospace;
  color: #555;
  line-height: 1.5;
}

.debug-panel .label {
  color: #888;
  font-weight: 600;
}

.debug-panel .val {
  color: #11998e;
}

.debug-panel .completed-true {
  color: #38ef7d;
  font-weight: 700;
}

.debug-panel .tasks-list {
  color: #e67e22;
}

/* ── Input area ─────────────────────────────────── */

.input-container {
  padding: 1rem;
  background: white;
  border-top: 1px solid #e0e0e0;
}

.input-wrapper {
  display: flex;
  gap: 0.5rem;
  align-items: flex-end;
}

.message-input {
  flex: 1;
  padding: 0.75rem;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  resize: none;
  font-family: inherit;
  font-size: 1rem;
  max-height: 120px;
  min-height: 44px;
}

.message-input:focus {
  outline: none;
  border-color: #11998e;
}

.message-input:disabled {
  background-color: #f5f5f5;
  color: #999;
}

.send-button {
  padding: 0.75rem 1.2rem;
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 600;
  transition: all 0.2s;
  height: 44px;
}

.send-button:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(17, 153, 142, 0.4);
}

.send-button:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.input-info {
  margin-top: 0.4rem;
  font-size: 0.78rem;
  color: #999;
  text-align: center;
}

/* ── Scrollbar ──────────────────────────────────── */

.messages-container::-webkit-scrollbar { width: 6px; }
.messages-container::-webkit-scrollbar-track { background: #f1f1f1; }
.messages-container::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
.messages-container::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

/* ── Mobile ─────────────────────────────────────── */

@media (max-width: 768px) {
  .chat-container { max-width: 100%; }
  .chat-header { padding: 0.75rem; }
  .chat-header h1 { font-size: 1.15rem; }
  .header-controls { flex-direction: column; gap: 0.4rem; }
  .message { max-width: 95%; }
  .input-container { padding: 0.75rem; }
}
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-top">
      <h1>Onboarding Agent</h1>
      <div class="header-controls">
        <input type="text" class="user-id-input" id="userIdInput" placeholder="Enter user ID..." />
        <span class="session-id" id="sessionIdDisplay">New session</span>
        <button class="reset-button" onclick="resetConversation()">Reset</button>
      </div>
    </div>

    <div class="settings-toggle">
      <button class="settings-toggle-btn" id="settingsBtn" onclick="toggleSettings()">Settings &#9662;</button>
      <div class="settings-panel" id="settingsPanel">
        <label>Care Recipient (JSON):</label>
        <textarea id="careRecipientJson"></textarea>
        <label style="margin-top:0.4rem">Veteran Status:</label>
        <select id="veteranStatus">
          <option value="Veteran">Veteran</option>
          <option value="Not a veteran">Not a veteran</option>
        </select>
      </div>
    </div>
  </div>

  <div class="completion-banner" id="completionBanner">
    Onboarding Complete! Data sent to WithCare.
    <br>
    <a id="withcareLink" href="#" target="_blank">Open WithCare Chat with this user &rarr;</a>
  </div>

  <div class="messages-container" id="messagesContainer">
    <div class="empty-state" id="emptyState">
      <p>Onboarding Agent Chat</p>
      <p class="hint">Enter a user ID and send a message to start onboarding.</p>
    </div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <textarea
        id="messageInput"
        class="message-input"
        placeholder="Type a message..."
        rows="1"
      ></textarea>
      <button id="sendButton" class="send-button" onclick="sendMessage()">Send</button>
    </div>
    <div class="input-info">Enter to send &middot; Shift+Enter for new line</div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────

let sessionId = null;
let messages = [];
let isLoading = false;
let conversationStarted = false;

const defaultCareRecipient = {
  address: "11650 National Boulevard, Los Angeles, California 90064, United States",
  dateOfBirth: "1954-04-11",
  dependentStatus: "Not a child/dependent",
  firstName: "Yiming",
  gender: "Male",
  isSelf: false,
  lastName: "Gong",
  legalName: "Yiming Gong",
  pronouns: "he/him/his",
  relationship: "dad",
  veteranStatus: "Veteran"
};

// Load saved state
const urlParams = new URLSearchParams(window.location.search);
const savedUserId = urlParams.get('userId') || localStorage.getItem('onboarding_user_id') || '';

const userIdInput = document.getElementById('userIdInput');
const careRecipientJson = document.getElementById('careRecipientJson');
const veteranSelect = document.getElementById('veteranStatus');

userIdInput.value = savedUserId;
careRecipientJson.value = JSON.stringify(defaultCareRecipient, null, 2);

userIdInput.addEventListener('change', () => {
  const val = userIdInput.value.trim();
  if (val) localStorage.setItem('onboarding_user_id', val);
  else localStorage.removeItem('onboarding_user_id');
});

function getUserId() {
  return userIdInput.value.trim() || null;
}

function getCareRecipient() {
  try {
    return JSON.parse(careRecipientJson.value);
  } catch (e) {
    alert('Invalid care recipient JSON: ' + e.message);
    return null;
  }
}

function getVeteranStatus() {
  return veteranSelect.value;
}

const container    = document.getElementById('messagesContainer');
const emptyState   = document.getElementById('emptyState');
const input        = document.getElementById('messageInput');
const sendBtn      = document.getElementById('sendButton');
const sessionIdEl  = document.getElementById('sessionIdDisplay');
const completionBanner = document.getElementById('completionBanner');
const withcareLink = document.getElementById('withcareLink');
const settingsPanel = document.getElementById('settingsPanel');
const settingsBtn = document.getElementById('settingsBtn');

// ── Settings toggle ─────────────────────────────────────────────────

function toggleSettings() {
  if (settingsPanel.style.display === 'block') {
    settingsPanel.style.display = 'none';
    settingsBtn.innerHTML = 'Settings &#9662;';
  } else {
    settingsPanel.style.display = 'block';
    settingsBtn.innerHTML = 'Settings &#9652;';
  }
}

// ── Input handling ───────────────────────────────────────────────────

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// ── Send message ─────────────────────────────────────────────────────

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isLoading) return;

  if (!getUserId()) {
    alert('Please enter a user ID before chatting.');
    userIdInput.focus();
    return;
  }

  // Lock settings after first message
  if (!conversationStarted) {
    conversationStarted = true;
    careRecipientJson.disabled = true;
    veteranSelect.disabled = true;
  }

  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';

  setLoading(true);

  try {
    const body = {
      message: text,
      session_id: sessionId,
      user_id: getUserId(),
    };

    // Send care_recipient and veteran_status on first message
    if (!sessionId) {
      const cr = getCareRecipient();
      if (!cr) { setLoading(false); return; }
      body.care_recipient = cr;
      body.veteran_status = getVeteranStatus();
    }

    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const err = await resp.text();
      addMessage('agent', `Error: ${resp.status} - ${err}`);
      return;
    }

    const data = await resp.json();
    sessionId = data.session_id;
    sessionIdEl.textContent = sessionId ? sessionId.substring(0, 8) + '...' : 'New session';

    addMessage('agent', data.reply, data.debug);

    // Show completion banner
    if (data.completed) {
      const uid = getUserId();
      const baseUrl = data.withcare_chat_url || 'http://localhost:8000';
      completionBanner.style.display = 'block';
      withcareLink.href = `${baseUrl}?userId=${encodeURIComponent(uid)}`;
    }
  } catch (err) {
    addMessage('agent', `Network error: ${err.message}`);
  } finally {
    setLoading(false);
  }
}

// ── Render helpers ───────────────────────────────────────────────────

function addMessage(role, content, debug) {
  messages.push({ role, content, debug });
  renderMessage(role, content, debug);
  emptyState.style.display = 'none';
  scrollToBottom();
}

function renderMessage(role, content, debug) {
  const wrapper = document.createElement('div');

  if (role === 'user') {
    wrapper.className = 'message user-message';
    wrapper.innerHTML = `
      <div class="message-header">
        <span class="source-badge">You</span>
      </div>
      <div class="message-content">${escapeHtml(content)}</div>
    `;
  } else {
    wrapper.className = 'message agent-message';
    const debugHtml = debug ? buildDebugHtml(debug) : '';
    wrapper.innerHTML = `
      <div class="message-header">
        <span class="source-badge">Onboarding Agent</span>
      </div>
      <div class="message-content">${escapeHtml(content)}</div>
      ${debugHtml}
    `;
  }

  container.appendChild(wrapper);
}

function buildDebugHtml(debug) {
  const id = 'dbg-' + Math.random().toString(36).substring(2, 8);
  const tree = debug.current_tree || 'N/A';
  const node = debug.node || 'N/A';
  const route = debug.route || 'N/A';
  const completed = debug.completed_whole_process || false;
  const score = debug.assessment_score ?? 0;
  const tasks = debug.tasks || [];
  const threadId = debug.thread_id || '';

  const completedClass = completed ? 'completed-true' : '';
  const tasksHtml = tasks.length > 0
    ? tasks.map(t => escapeHtml(t)).join(', ')
    : 'none';

  // WithCare ingest result
  let ingestHtml = '';
  if (debug.withcare_ingest) {
    const wi = debug.withcare_ingest;
    const statusColor = wi.status === 'ok' ? '#38ef7d' : '#e74c3c';
    ingestHtml = `<div style="margin-top:4px"><span class="label">WithCare Ingest: </span><span style="color:${statusColor};font-weight:700">${escapeHtml(wi.status || 'unknown')}</span></div>`;
    if (wi.total_facts_written != null) {
      ingestHtml += `<div><span class="label">Facts written: </span>${wi.total_facts_written}</div>`;
    }
    if (wi.error) {
      ingestHtml += `<div style="color:#e74c3c"><span class="label">Error: </span>${escapeHtml(wi.error)}</div>`;
    }
  }

  // Error / traceback
  let errorHtml = '';
  if (debug.error) {
    errorHtml = `<div style="color:#e74c3c;margin-top:4px"><span class="label">ERROR: </span>${escapeHtml(debug.error)}</div>`;
  }

  return `
    <div class="debug-toggle">
      <button class="debug-toggle-btn" onclick="toggleDebug('${id}')">debug info &#9662;</button>
      <div class="debug-panel" id="${id}">
        <div><span class="label">Thread: </span><span class="val">${escapeHtml(threadId)}</span></div>
        <div><span class="label">Tree: </span><span class="val">${escapeHtml(tree)}</span></div>
        <div><span class="label">Node: </span><span class="val">${escapeHtml(node)}</span></div>
        <div><span class="label">Route: </span><span class="val">${escapeHtml(route)}</span></div>
        <div><span class="label">Completed: </span><span class="${completedClass}">${completed}</span></div>
        <div><span class="label">Assessment Score: </span>${score}</div>
        <div><span class="label">Tasks: </span><span class="tasks-list">${tasksHtml}</span></div>
        ${ingestHtml}
        ${errorHtml}
      </div>
    </div>
  `;
}

function toggleDebug(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const btn = el.previousElementSibling;
  if (el.style.display === 'none') {
    el.style.display = 'block';
    btn.innerHTML = 'debug info &#9662;';
  } else {
    el.style.display = 'none';
    btn.innerHTML = 'debug info &#9656;';
  }
}

function setLoading(on) {
  isLoading = on;
  sendBtn.disabled = on;
  input.disabled = on;

  const existing = document.getElementById('loadingBubble');
  if (on && !existing) {
    const el = document.createElement('div');
    el.id = 'loadingBubble';
    el.className = 'message loading-message';
    el.innerHTML = '<div class="spinner"></div> Thinking...';
    container.appendChild(el);
    scrollToBottom();
  } else if (!on && existing) {
    existing.remove();
  }
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    container.scrollTop = container.scrollHeight;
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Reset ────────────────────────────────────────────────────────────

async function resetConversation() {
  if (sessionId) {
    try {
      await fetch('/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId }),
      });
    } catch (_) { /* ignore */ }
  }

  sessionId = null;
  messages = [];
  conversationStarted = false;
  sessionIdEl.textContent = 'New session';
  completionBanner.style.display = 'none';

  // Unlock settings
  careRecipientJson.disabled = false;
  veteranSelect.disabled = false;

  // Clear rendered messages
  container.innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'empty-state';
  empty.id = 'emptyState';
  empty.innerHTML = '<p>Onboarding Agent Chat</p><p class="hint">Enter a user ID and send a message to start onboarding.</p>';
  container.appendChild(empty);
}
</script>
</body>
</html>
